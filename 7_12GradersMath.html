<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Practice · Grades 7–12</title>
<style>
:root{
  --text:#1a1a1a;--muted:#5f5f5f;--faint:#9a9a9a;--line:#dcdcdc;
  --bg:#ffffff;--good:#1a9e54;--bad:#d64545;--good-tint:#e6f6ec;--bad-tint:#fbe9e9;
}
@media (prefers-color-scheme: dark){
  :root{--text:#f2f2f2;--muted:#b0b0b0;--faint:#7a7a7a;--line:#3a3a3a;--bg:#171717;--good:#3fbf72;--bad:#e06c6c;--good-tint:#14301f;--bad-tint:#3a1b1b}
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:4vh 4vw}
.app{width:100%;max-width:1100px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-bottom:16px}
h1{font-size:clamp(20px,2.6vw,28px);font-weight:600}
.grades{display:flex;gap:6px;flex-wrap:wrap}
.grade{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:8px 18px;font-size:clamp(15px,1.6vw,18px);cursor:pointer;font-family:inherit}
.grade.sel{background:var(--text);color:var(--bg);border-color:var(--text)}
.topics{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.topic{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:6px 14px;font-size:clamp(14px,1.4vw,16px);cursor:pointer;font-family:inherit}
.topic.sel{background:var(--text);color:var(--bg);border-color:var(--text)}
.card{border:1px solid var(--line);border-radius:12px;padding:clamp(20px,4vw,40px);min-height:220px;display:flex;flex-direction:column;justify-content:center}
.meta{display:flex;justify-content:space-between;font-size:clamp(13px,1.3vw,15px);color:var(--faint);margin-bottom:12px}
.q{font-size:clamp(26px,4.2vw,44px);font-weight:600;line-height:1.25;font-variant-numeric:tabular-nums}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}
.opt{border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--text);padding:clamp(14px,2.2vw,22px) clamp(18px,2.5vw,28px);font-size:clamp(20px,2.8vw,30px);text-align:left;cursor:pointer;font-family:inherit;font-variant-numeric:tabular-nums;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--text)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--good);background:var(--good-tint)}
.opt.wrong{border-color:var(--bad);background:var(--bad-tint)}
.fb{min-height:28px;font-size:clamp(14px,1.5vw,17px);margin-top:14px}
.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:20px;flex-wrap:wrap}
.stats{display:flex;gap:26px;font-size:clamp(14px,1.5vw,17px);color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{font-weight:600;color:var(--text)}
.next{border:1px solid var(--text);border-radius:8px;background:var(--text);color:var(--bg);padding:12px 26px;font-size:clamp(15px,1.6vw,18px);cursor:pointer;font-family:inherit;visibility:hidden}
.next.show{visibility:visible}
.bar{height:8px;border-radius:999px;background:var(--line);margin-top:16px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--text);width:0%;transition:width .25s}
.kbd-hint{font-size:13px;color:var(--faint);margin-top:12px;text-align:center}
@media (max-width:640px){.opts{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Math practice</h1>
    <div class="grades" id="grades"></div>
  </header>
  <div class="topics" id="topics"></div>
  <div class="card">
    <div class="meta"><span id="meta"></span><span id="count"></span></div>
    <div class="q" id="q"></div>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb"></div>
  </div>
  <div class="foot">
    <div class="stats"><span>Score <b id="sc">0</b></span><span>Streak <b id="st">0</b></span><span>Best <b id="bs">0</b></span><span>Accuracy <b id="ac">–</b></span></div>
    <button class="next" id="next">Next question →</button>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="kbd-hint">Keys 1–4 select an answer · Enter = next question</div>
</div>
<script>
(function(){
const G={};
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[ri(0,a.length-1)]}
function gcd(a,b){return b?gcd(b,a%b):a}

G.integers={name:'Integers & fractions',gen(){const k=ri(1,4);
if(k===1){const a=ri(2,12),b=ri(2,12),c=ri(1,9),d=ri(1,9);return mkQ(`Add: ${a}/${b} + ${c}/${d}`,frac(a*d+b*c,b*d),[frac(a*d-b*c,b*d),frac(a*c,b*d),frac(a*d+b*c+b*d,b*d)])}
if(k===2){const n=ri(-20,20),m=ri(-15,15);return mkQ(`Compute: (${n}) − (${m})`,n-m,[n+m,-n-m,n-m+2])}
if(k===3){const a=ri(2,15),p=ri(10,90);return mkQ(`${p}% of ${a*10} = ?`,a*p/10,[a*p,a*p/10+3,a*p/10-3])}
const a=ri(-9,9),b=ri(-9,9);return mkQ(`Compute: (${a}) × (${b})`,a*b,[a*b+ri(1,3),-a*b,a*b-ri(1,3)])}};

G.linear={name:'Linear equations',gen(){const x=ri(-10,15),a=ri(2,9)*(Math.random()<0.3?-1:1),b=ri(-15,15),c=a*x+b;
return mkQ(`Solve for x: ${a===1?'':a}x ${b>=0?'+':'−'} ${Math.abs(b)} = ${c}`,x,[x+2,x-2,-x])}};

G.ratio={name:'Ratios & proportions',gen(){const a=ri(2,9),b=ri(2,9),k=ri(2,8);
return mkQ(`a : b = ${a} : ${b} and a = ${a*k}. b = ?`,b*k,[a*k,b*(k+1),b*k+3])}};

G.exponents={name:'Exponents & radicals',gen(){const k=ri(1,3);
if(k===1){const b=ri(2,6),e=ri(2,4),e2=ri(2,4);return mkQ(`Simplify: ${b}^${e} × ${b}^${e2}`,b**(e+e2),[b**(e+e2+1),b**e+b**e2,b**(e*e2)])}
if(k===2){const n=pick([4,9,16,25,36,49,64,81,100,121,144]);return mkQ(`√${n} = ?`,Math.sqrt(n),[Math.sqrt(n)+2,Math.sqrt(n)-1,n/2])}
const b=ri(2,5),e=ri(2,3);return mkQ(`${b}^${e} = ?`,b**e,[b**e+b,b**(e+1),b*e])}};

G.geometry={name:'Geometry',gen(){const k=ri(1,4);
if(k===1){const l=ri(3,15),w=ri(2,12);return mkQ(`Rectangle: length ${l}, width ${w}. Area = ?`,l*w,[2*(l+w),l*w+4,l+w])}
if(k===2){const s=ri(3,14);return mkQ(`Square side ${s}. Perimeter = ?`,4*s,[s*s,2*s,4*s+4])}
if(k===3){const trips=[[3,4,5],[6,8,10],[5,12,13],[9,12,15],[8,15,17],[7,24,25],[12,16,20]];const[a,b,c]=pick(trips);
return mkQ(`Right triangle legs ${a} and ${b}. Hypotenuse = ?`,c,[a+b,c+2,Math.abs(a-b)])}
const r=ri(2,10);return mkQ(`Circle radius ${r}. Area = ? (use π ≈ 3.14)`,+(Math.PI*r*r).toFixed(2),[+(2*Math.PI*r).toFixed(2),+(Math.PI*r*r+5).toFixed(2),r*r])}};

G.quadratic={name:'Quadratic equations',gen(){const r1=ri(-8,8),r2=ri(-8,8);const b=-(r1+r2),c=r1*r2;
return mkQ(`Solve: x² ${b>=0?'+':'−'} ${Math.abs(b)} ${c>=0?'+':'−'} ${Math.abs(c)} = 0. One value of x = ?`,r1,[r2,r1+3,-r1])}};

G.functions={name:'Functions',gen(){const a=ri(2,6),b=ri(-9,9),x=ri(-6,8);
return mkQ(`If f(x) = ${a}x² ${b>=0?'+':'−'} ${Math.abs(b)}, find f(${x}).`,a*x*x+b,[a*x+b,a*x*x-b,a*(x+b)])}};

G.trig={name:'Trigonometry',gen(){const ang=pick([0,30,45,60,90]);const fn=pick(['sin','cos','tan']);
let v;if(fn==='sin')v=ang===0?0:ang===30?0.5:ang===45?Math.SQRT1_2:ang===60?Math.sqrt(3)/2:1;
if(fn==='cos')v=ang===0?1:ang===30?Math.sqrt(3)/2:ang===45?Math.SQRT1_2:ang===60?0.5:0;
if(fn==='tan')v=ang===0?0:ang===30?Math.sqrt(3)/3:ang===45?1:Math.sqrt(3);
const table={0:'0',0.5:'1/2','0.7071067811865476':'√2/2','0.8660254037844386':'√3/2',1:'1','0.5773502691896257':'√3/3','1.7320508075688772':'√3'};
const disp=table[Object.keys(table).find(kk=>Math.abs(parseFloat(kk)-v)<1e-9)]||String(v);
const pool=['0','1/2','√2/2','√3/2','1','√3/3','√3'].filter(o=>o!==disp);
const opts=[disp];while(opts.length<4){const o=pick(pool);if(!opts.includes(o))opts.push(o)}
for(let i=opts.length-1;i>0;i--){const j=ri(0,i);[opts[i],opts[j]]=[opts[j],opts[i]]}
return{t:`${fn}(${ang}°) = ?`,ans:disp,opts}}};

G.logarithms={name:'Logarithms',gen(){const b=pick([2,3,5,10]),e=ri(2,4);
return mkQ(`Evaluate: log base ${b} of ${b**e}`,e,[e+1,b**e,b])}};

G.sequences={name:'Sequences',gen(){const a=ri(1,9),d=ri(2,8),n=ri(6,15);
return mkQ(`Arithmetic sequence: first term ${a}, difference ${d}. Term ${n} = ?`,a+(n-1)*d,[a+n*d,a+(n-1)*d+2,a*n])}};

G.derivatives={name:'Derivatives',gen(){const k=ri(1,3);
if(k===1){const n=ri(2,6);return mkQ(`d/dx [x^${n}] = ?`,n+'x^'+(n-1),[n+'x^'+n,'x^'+(n-1),(n-1)+'x^'+n])}
if(k===2){const a=ri(2,7),b=ri(2,6);return mkQ(`d/dx [${a}x^${b}] = ?`,(a*b)+'x^'+(b-1),[(a*b)+'x^'+b,a+'x^'+(b-1),(a+b)+'x^'+(b-1)])}
const a=ri(2,5);return mkQ(`d/dx [sin(${a}x)] = ?`,a+'cos('+a+'x)',[a+'sin('+a+'x)','cos('+a+'x)','-'+a+'cos('+a+'x)'])}};

function frac(n,d){const g=gcd(Math.abs(n),Math.abs(d))||1;n/=g;d/=g;if(d<0){n=-n;d=-d}return d===1?''+n:n+'/'+d}
function mkQ(t,ansStr,distr){const ans=String(ansStr);const set=new Set([ans]);let ds=[];
for(const x of distr){const s=String(x);if(!set.has(s)){set.add(s);ds.push(x)}}
let guard=0;while(ds.length<3&&guard++<80){const base=parseFloat(ans);if(!isFinite(base))break;
const x=base+pick([-1,1])*ri(1,Math.max(3,Math.round(Math.abs(base)/2)+2));const s=String(x);if(!set.has(s)){set.add(s);ds.push(x)}}
const opts=[ans,...ds.slice(0,3)];for(let i=opts.length-1;i>0;i--){const j=ri(0,i);[opts[i],opts[j]]=[opts[j],opts[i]]}
return{t,ans,opts:opts.map(String)}}

const GRADES={7:['integers','linear','ratio'],8:['linear','exponents','geometry'],9:['exponents','quadratic','geometry'],10:['quadratic','functions','geometry','trig'],11:['trig','logarithms','sequences','functions'],12:['logarithms','sequences','derivatives']};
const $=id=>document.getElementById(id);
let grade=7,topic=GRADES[7][0],cur=null,answered=false,score=0,streak=0,best=0,total=0,correct=0;

function renderGrades(){$('grades').innerHTML='';Object.keys(GRADES).forEach(g=>{const b=document.createElement('button');b.className='grade'+(+g===grade?' sel':'');b.textContent='Grade '+g;b.onclick=()=>{grade=+g;topic=GRADES[grade][0];renderTopics();newQ()};$('grades').appendChild(b)})}
function renderTopics(){$('topics').innerHTML='';GRADES[grade].forEach(t=>{const b=document.createElement('button');b.className='topic'+(t===topic?' sel':'');b.textContent=G[t].name;b.onclick=()=>{topic=t;renderTopics();newQ()};$('topics').appendChild(b)})}
function newQ(){answered=false;$('fb').textContent='';$('fb').className='fb';$('next').classList.remove('show');
cur=G[topic].gen();total++;$('meta').textContent='Grade '+grade+' · '+G[topic].name;$('count').textContent='Question '+total;
$('q').textContent=cur.t;const box=$('opts');box.innerHTML='';
cur.opts.forEach(o=>{const b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>answer(b,o);box.appendChild(b)})}
function answer(btn,val){if(answered)return;answered=true;
const btns=[...document.querySelectorAll('.opt')];btns.forEach(b=>b.disabled=true);
const ok=val===cur.ans;btns.forEach(b=>{if(b.textContent===cur.ans)b.classList.add('correct')});
if(ok){score+=10;streak++;correct++;$('fb').textContent='Correct! +10 points';$('fb').className='fb good'}
else{btn.classList.add('wrong');streak=0;$('fb').textContent='Not quite — the answer is '+cur.ans;$('fb').className='fb bad'}
best=Math.max(best,streak);$('sc').textContent=score;$('st').textContent=streak;$('bs').textContent=best;
$('ac').textContent=Math.round(correct/total*100)+'%';$('bar').style.width=(correct/total*100)+'%';
$('next').classList.add('show')}
$('next').onclick=newQ;
document.addEventListener('keydown',e=>{const map={'1':0,'2':1,'3':2,'4':3};
if(!answered&&e.key in map){const b=document.querySelectorAll('.opt')[map[e.key]];if(b)b.click()}
else if(answered&&e.key==='Enter'){$('next').click()}});
renderGrades();renderTopics();newQ();
})();
</script>
</body>
</html>
